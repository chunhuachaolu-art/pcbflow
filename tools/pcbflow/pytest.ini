# REPAIR-P1 W-1 测试配置落地（exec/REPAIR-P1-TEST-BASELINE-TASKBOOK-2026-09-13.md）。
# 约定运行口径：cwd=仓库根（tools/pcbflow），环境 PYTHONUTF8=1 PYTHONIOENCODING=utf-8
# （编码经调用方环境注入，ini 无环境项；与 out/v4.1-engineering/baseline/baseline-report.md §2 一致）。
#
# 失败隔离纪律（REPAIR-P1 W-3；「已知失败」唯一合法形态二选一）：
#   1) xfail(strict=True) 带理由（负对照先例 tests/test_fd1.py、tests/test_cas.py 的 R28 孪生）；
#   2) 登记 baseline.json.known_open 且被 tests/test_baseline_snapshot.py 精确匹配
#      （盘上登记清单=仓库根 known_open.json，多/少皆 fail）。
#   第三形态（裸 failed/errors 挂账）非法——全量 0 failed / 0 errors 是唯一合入门。
#
# basetemp 固定仓内 E 盘相对路径（SEC-PERF-REVIEW-2026-09-19 ENV-01 吸收：
# pytest 缺省 %TEMP% 在 C 盘、仓在 E 盘，跨盘 os.path.relpath 抛错 7 例）。
# 相对路径按调用 cwd=仓库根解析；该目录每次运行会被 pytest 清空重建，勿放任何要保留的东西。
[pytest]
testpaths =
    tests
    pcbflow/v4exp/tests
addopts =
    -q
    --basetemp=.pytest-tmp
# 自定义 marker：当前为零（套件仅用 parametrize/skipif/xfail 内建标记）；
# 首个自定义 marker 落地时在此注册（避免 PytestUnknownMarkWarning 静默漂移）。
